name: CI

# M6 (adversarial review): a minimal CPU build + test lane so a broken commit is caught
# automatically instead of only when a human remembers to run the WSL build scripts.
# Vulkan/HIP are off here (no GPU runner yet, TRD §60's self-hosted gfx1151 lane is a
# separate follow-up); ~110 tests self-skip via GTEST_SKIP without the HALO_REF_DIR
# fixture directory (which this runner does not have) and are reported as skipped, not
# passed or failed.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1' # weekly, Monday 07:30 UTC

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake libsqlite3-dev

      # k6 for the ctest load smoke (load/smoke.js against halo_load_server); without it the
      # test reports SKIPPED instead of running.
      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DHALO_BUILD_VULKAN=OFF -DHALO_BUILD_HIP=OFF

      # Builds, runs ctest and writes .test-report/summary.md (failures with file:line,
      # expected vs actual and a rerun-only command) for whoever fixes a red run.
      - name: Build and test
        run: scripts/test-agent

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: .test-report/
          include-hidden-files: true  # .test-report is a dot dir: skipped by default
          if-no-files-found: ignore

  # AddressSanitizer + UBSan + LeakSanitizer over the same suite (Debug). test-agent sets
  # UBSAN_OPTIONS=halt_on_error=1, so undefined behaviour fails the test instead of only printing;
  # the report names the bug kind and the first in-repo frame (access, allocation, leak site).
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake libsqlite3-dev

      # k6 for the ctest load smoke (load/smoke.js against halo_load_server); without it the
      # test reports SKIPPED instead of running.
      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'

      - name: Configure (ASan + UBSan, Debug)
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DHALO_ENABLE_ASAN=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DHALO_BUILD_VULKAN=OFF -DHALO_BUILD_HIP=OFF

      - name: Build and test under sanitizers
        run: scripts/test-agent --build-dir=build-asan --report-dir=.test-report-asan

      - name: Upload sanitizer test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-asan
          path: .test-report-asan/
          include-hidden-files: true
          if-no-files-found: ignore

  # ThreadSanitizer over the whole suite: the API server (httplib workers, ConnectionGuard scanner,
  # admission), engine/scheduler threads and the template parse thread. Separate build dir because
  # TSan cannot be combined with ASan. cmake/tsan.supp lists the reviewed false positives.
  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake libsqlite3-dev

      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'

      - name: Configure (TSan, Debug)
        run: |
          cmake -S . -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DHALO_ENABLE_TSAN=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DHALO_BUILD_VULKAN=OFF -DHALO_BUILD_HIP=OFF

      - name: Build and test under ThreadSanitizer
        run: scripts/test-agent --build-dir=build-tsan --report-dir=.test-report-tsan

      - name: Upload TSan test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-tsan
          path: .test-report-tsan/
          include-hidden-files: true
          if-no-files-found: ignore

  # Coverage-guided fuzzing (libFuzzer + ASan/UBSan) of the parsers that take untrusted input: GGUF
  # files, API request bodies (through render + tokenize) and model output (tests/fuzz/README.md).
  # Blocking and deterministic: a fixed seed and run count per target over the checked-in corpus.
  # A finding fails the job; its reproducer is in the uploaded report (fuzz/<target>/artifacts).
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake libsqlite3-dev

      - name: Configure (libFuzzer + ASan + UBSan)
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHALO_BUILD_FUZZERS=ON -DHALO_ENABLE_ASAN=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DHALO_BUILD_VULKAN=OFF -DHALO_BUILD_HIP=OFF

      - name: Build the fuzz targets
        run: cmake --build build-fuzz --target fuzz_gguf fuzz_api_request fuzz_output_parser fuzz_chat_template

      - name: Fuzz (seed replay + fixed-seed campaigns)
        run: scripts/test-agent --build-dir=build-fuzz --report-dir=.test-report-fuzz --no-build -- -L fuzz

      - name: Upload fuzz report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-fuzz
          path: .test-report-fuzz/
          include-hidden-files: true
          if-no-files-found: ignore
